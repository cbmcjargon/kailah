[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
Permissions-Policy = "camera=(self), geolocation=(), microphone=(), payment=(), hid=(self), usb=(self)"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
Cross-Origin-Opener-Policy = "same-origin"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://mempool.space https://mempool.emzy.de https://mempool.bitaroo.net https://blockstream.info https://litecoinspace.org https://api.blockcypher.com https://api.coinbase.com https://api.exchange.coinbase.com https://api.coingecko.com https://mainnet.base.org https://base-rpc.publicnode.com https://sepolia.base.org https://base.blockscout.com https://base-sepolia.blockscout.com https://ethereum-rpc.publicnode.com https://cloudflare-eth.com https://arb1.arbitrum.io https://arbitrum-one-rpc.publicnode.com https://eth.blockscout.com https://arbitrum.blockscout.com https://solana-rpc.publicnode.com https://api.devnet.solana.com https://api.jup.ag https://api.trongrid.io https://nile.trongrid.io https://bsc-rpc.publicnode.com https://bsc-dataseed.bnbchain.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; require-trusted-types-for 'script'; trusted-types default"