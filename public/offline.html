<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/offline.css" />
    <title>Kailah Wallet — offline</title>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" width="72" height="72" />
      <h1>You're offline</h1>
      <p>
        Kailah Wallet always loads fresh from the network — it never runs from a cached copy, so
        nobody can serve you stale wallet code. Reconnect and try again.
      </p>
      <p class="note">Your keys and money are safe: they live encrypted on this device, not online.</p>
      <a class="retry" href="/">Try again</a>
    </main>
  </body>
</html>
