# The marketing site's server block on the mirror (site/, not the wallet).
# deploy/site-redeploy.sh --install writes it once with the placeholders
# filled in; deploy/nginx-site.awk then adds the security headers, the HTML
# cache line and the gzip block on every deploy, exactly as it does for the
# wallet's own file, and certbot adds the TLS lines. Keep every `location`
# with its `{` on the same line: the rewrite stops otherwise. This page keeps
# no access log: the rewrite re-asserts that on every deploy, in this block and
# in the http redirect block certbot adds.
server {
    server_name @SITE_HOST@;
    access_log off;
    root @ROOT@;
    index index.html;

    # Images aren't hashed but change rarely: a day in cache, then re-checked.
    location /img/ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        try_files $uri =404;
    }

    # The stylesheet and script aren't hashed either: always re-checked.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Everything else is a file or a 404. No fallback page: this is not an app.
    location / {
        try_files $uri $uri/ =404;
    }

    listen 80;
}
