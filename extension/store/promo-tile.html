<!doctype html>
<!-- Chrome Web Store small promo tile, 440×280. Render: see docs/extension.md
     ("Store images"). Brand only, per the store's guidance: no screenshot,
     saturated colours, full-bleed, legible at half size. Mark = public/icon.svg
     without its rounded-square backdrop. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(circle at 26% 50%, rgba(94, 234, 212, 0.34) 0, rgba(94, 234, 212, 0) 46%),
          linear-gradient(135deg, #0f6b63 0%, #0b2f4d 52%, #0b0e14 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      .rings {
        position: absolute;
        inset: 0;
      }
      .mark {
        position: absolute;
        left: 40px;
        top: 66px;
        width: 148px;
        height: 148px;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.35));
      }
      .name {
        position: absolute;
        left: 212px;
        top: 84px;
        line-height: 0.98;
        font-weight: 800;
        font-size: 52px;
        letter-spacing: -0.02em;
        color: #f2f4f8;
      }
      .name span {
        display: block;
        color: #5eead4;
      }
    </style>
  </head>
  <body>
    <svg class="rings" viewBox="0 0 440 280" aria-hidden="true">
      <circle cx="114" cy="140" r="118" fill="none" stroke="rgba(94,234,212,0.16)" stroke-width="2" />
      <circle cx="114" cy="140" r="168" fill="none" stroke="rgba(94,234,212,0.09)" stroke-width="2" />
      <circle cx="114" cy="140" r="222" fill="none" stroke="rgba(94,234,212,0.05)" stroke-width="2" />
    </svg>
    <svg class="mark" viewBox="80 80 352 352" aria-hidden="true">
      <circle cx="256" cy="256" r="152" fill="#0b0e14" stroke="#5eead4" stroke-width="26" />
      <path
        d="M212 164v184M212 256l104-92M212 256l104 92"
        stroke="#f2f4f8"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
    <div class="name">Kailah<span>Wallet</span></div>
  </body>
</html>
